<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ジャイロ・ラグナロク｜コマになってぶつかり合う3Dバトル</title>
<meta name="description" content="自分がコマになって戦うブラウザゲーム。スティックで動いて、狙った方向へダッシュ。ジャンプ台で跳んで相手の頭上から突撃。回転が尽きるか場外で負け。スマホとPCで遊べる。">
<meta property="og:type" content="website">
<meta property="og:title" content="ジャイロ・ラグナロク（GYRO RAGNAROK）">
<meta property="og:description" content="自分がコマになって戦う3Dバトル。跳んで、相手の頭上から突撃。スマホとPCで遊べる。">
<meta property="og:image" content="https://tom3games.github.io/koma-battle/og.png">
<meta property="og:url" content="https://tom3games.github.io/koma-battle/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1b1f3b">
<link rel="icon" href="TemplateData/icon.png">
<link rel="apple-touch-icon" href="TemplateData/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@500;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="TemplateData/ui.css?v=10">
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>

<div id="load" class="scr">
  <svg class="ld-koma" viewBox="0 0 120 120" aria-hidden="true">
    <ellipse cx="60" cy="104" rx="34" ry="6" fill="#0d1028" opacity=".55"/>
    <g class="ld-spin">
      <path d="M60 100 L52 82 H68 Z" fill="#9aa1ab"/>
      <ellipse cx="60" cy="70" rx="44" ry="12" fill="#5a1d14"/>
      <ellipse cx="60" cy="66" rx="44" ry="12" fill="#b8402e"/>
      <rect x="49" y="44" width="22" height="22" fill="#555b64"/>
      <ellipse cx="60" cy="44" rx="11" ry="4" fill="#b08a4a"/>
      <path d="M20 66 l-10 -8 l16 2 z M100 66 l10 8 l-16 -2 z" fill="#c9ccd2"/>
    </g>
  </svg>
</div>

<div id="title" class="scr">
  <div class="tt-block">
    <div class="tt-kicker">GYRO RAGNAROK</div>
    <h1 class="tt-name">ジャイロ<br>ラグナロク</h1>
    <p class="tt-lead">自分がコマになる。跳んで、上から落とせ。</p>
    <button id="btnPlay" class="btn-main">はじめる</button>
  </div>
  <div class="tt-keys pc-only">
    <span><b>WASD</b>移動</span><span><b>Shift</b>速く</span><span><b>マウス</b>視点</span><span><b>左クリック</b>ダッシュ</span><span><b>右クリック</b>必殺</span>
  </div>
</div>

<div id="select" class="scr" hidden>
  <div class="sel-panel">
    <div class="sel-head">コマを組む</div>
    <div id="slots"></div>
  </div>
  <div class="sel-side">
    <div class="sel-stats" id="stats"></div>
    <div class="sel-row">
      <div class="sel-vs">
        <div class="vs-label">相手</div>
        <div class="vs-pick" id="vsPick">
          <button data-n="1">1</button><button data-n="2" class="on">2</button><button data-n="3">3</button>
        </div>
      </div>
      <button id="btnFight" class="btn-main">試合開始</button>
    </div>
  </div>
</div>

<div id="hud" class="scr" hidden>
  <div id="tags"></div>
  <div class="hud-time" id="hudTime"></div>
  <div id="spReady" class="pc-only">必殺　右クリック</div>
  <div id="count" class="count"></div>
  <div id="sudden" class="sudden" hidden>最終局面　外側の床が崩れる</div>
</div>

<div id="fx" aria-hidden="true">
  <svg id="lines" viewBox="-50 -50 100 100" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="flash"></div>
  <div id="onoma"></div>
  <div id="banner"><span></span></div>
</div>

<div id="touch" hidden>
  <div id="camZone"></div>
  <div id="stickZone"></div>
  <div id="flickZone"></div>
  <div id="stick"><i></i></div>
  <svg id="flickArrow" aria-hidden="true"><line id="faLine" x1="0" y1="0" x2="0" y2="0"/><circle id="faOrigin" r="28"/><circle id="faDot" r="12"/></svg>
  <button id="tSpBtn" class="tb sp" aria-label="必殺"><svg viewBox="0 0 48 48"><path d="M24 4l5 13 14 1-11 9 4 14-12-8-12 8 4-14-11-9 14-1z" fill="#fff"/></svg></button>
</div>

<div id="hint" hidden>
  <div class="h-l"><div class="h-ring"><i></i></div><b>左で動く</b><small>外をなぞると視点</small></div>
  <div class="h-r"><div class="h-flick"><i></i></div><b>右を倒して離すとダッシュ</b><small>空中なら上から急降下</small></div>
  <div class="h-s"><b>星が光ったら必殺</b></div>
</div>

<div id="result" class="scr" hidden>
  <div class="rs-card">
    <div class="rs-big" id="rsBig">勝ち</div>
    <div class="rs-why" id="rsWhy"></div>
    <div class="rs-line" id="rsLine"></div>
    <div class="rs-btns">
      <button id="btnAgain" class="btn-main">もう一回</button>
      <button id="btnParts" class="btn-sub">パーツを変える</button>
    </div>
  </div>
</div>

<div id="ldMini"><div class="ld-bar"><i id="ldFill"></i></div><span id="ldText">スタジアム設営中</span></div>

<button id="btnMute" class="mute" aria-label="音">
  <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path id="muteWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path id="muteX" d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2" stroke-linecap="round" hidden/></svg>
</button>

<div class="credit" id="credit">効果音: CC0（Kenney ほか）／BGM: Suno で作成</div>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a,#touch')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  document.addEventListener('contextmenu',function(e){e.preventDefault()});
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
  // 見えている高さ（Safari のツールバーを除く）
  function vv(){var h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight;document.documentElement.style.setProperty('--vvh',h+'px')}
  vv();(window.visualViewport||window).addEventListener('resize',vv);window.addEventListener('orientationchange',function(){setTimeout(vv,300)});
  if(matchMedia('(pointer: coarse)').matches)document.documentElement.classList.add('touch');
})();
(function(){
  var errs=[];window.__kbErrs=errs;
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },5000);
})();
window.KB_BUILD = { loader: "Build/docs.loader.js", data: "Build/docs.data.unityweb", framework: "Build/docs.framework.js.unityweb", code: "Build/docs.wasm.unityweb", company: "tom3games", product: "GYRO RAGNAROK", version: "1.0" };
</script>
<script src="TemplateData/sfx.js?v=10"></script>
<script src="TemplateData/ui.js?v=10"></script>
</body>
</html>
